version: "2"
linters:
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - revive
    - unconvert
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (io.Closer).Close
        - (*os.File).Close
    gosec:
      excludes:
        - G304 # file paths come from CLI flags by design
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, noctx]
